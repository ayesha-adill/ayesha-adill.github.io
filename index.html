  <title>Ayesha Adil — Mechanical &amp; Biomedical Design Engineer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <style>
    :root{
      --lilac-bg:      #f7f3fb;
      --lilac-wash:    #eee5f7;
      --lilac-border:  #8b6bb8;
      --lilac-soft:    #cdbbe4;
      --plum:          #362a4a;
      --plum-soft:     #6b5c85;
      --white:         #ffffff;
      --radius: 14px;
      --maxw: 980px;
    }
    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }
    body{
      margin:0;
      background:var(--lilac-bg);
      color:var(--plum);
      font-family:'Inter', sans-serif;
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    @media (prefers-reduced-motion: reduce){
      html{ scroll-behavior:auto; }
      *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
    }
    a{ color:inherit; }
    
    /* ================= LANDING SECTION ================= */
    .landing{
      height:100vh;
      min-height:550px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:0 24px;
      background: linear-gradient(180deg, var(--white) 0%, var(--lilac-bg) 100%);
      position:relative;
    }
    .landing h1{
      font-family:'Fraunces', serif;
      font-weight:600;
      font-size:clamp(2.5rem, 7vw, 4.2rem);
      margin:0 0 12px 0;
      color:var(--plum);
      line-height:1.1;
    }
    .landing p{
      font-size:clamp(1rem, 2.5vw, 1.25rem);
      color:var(--plum-soft);
      margin:0 0 32px 0;
      font-weight:500;
    }

    /* Landing Links Bar */
    .landing-links{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }
    .landing-links a.link-item{
      font-size:0.9rem;
      font-weight:500;
      color:var(--plum-soft);
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition:color .15s ease;
    }
    .landing-links a.link-item:hover{ color:var(--plum); }
    .landing-links .sep{ color:var(--lilac-soft); font-size:0.9rem; }
    .landing-links .icon{ width:16px; height:16px; flex-shrink:0; stroke:var(--lilac-border); fill:none; stroke-width:1.8; }
    
    .btn{
      font-size:0.88rem; font-weight:600; letter-spacing:0.01em;
      text-decoration:none; padding:10px 22px; border-radius:8px;
      transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
      display:inline-flex; align-items:center; gap:8px;
    }
    .btn-primary{ background:var(--lilac-border); color:#fff; }
    .btn-primary:hover{ background:#7a5aa6; transform:translateY(-2px); box-shadow:0 8px 20px rgba(139,107,184,0.3); }

    .scroll-prompt{
      position:absolute;
      bottom:32px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      color:var(--lilac-border);
      text-decoration:none;
      font-size:0.75rem;
      font-weight:600;
      letter-spacing:0.05em;
      text-transform:uppercase;
      transition:transform 0.2s ease;
    }
    .scroll-prompt:hover{ transform:translateY(3px); }
    .scroll-prompt svg{
      width:20px;
      height:20px;
      stroke:var(--lilac-border);
      fill:none;
      stroke-width:2;
    }

    main{ padding:60px 24px 100px; }

      max-width:var(--maxw); margin:0 auto 56px;
      background:var(--white);
      border:1.5px solid var(--lilac-soft);
      border-radius:var(--radius);
